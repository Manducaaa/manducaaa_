<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020503">
  <meta name="description" content="MDS/86 Legacy Terminal — made by manduca.">
  <title>MDS/86 // TERMINAL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="crt" class="crt" aria-live="polite">
    <div class="noise"></div>
    <div class="scanline"></div>
    <section id="terminal" class="terminal">
      <div id="output" class="output"></div>
      <form id="nameForm" class="name-form hidden" autocomplete="off">
        <label for="nameInput">ENTER SUBJECT NAME:</label>
        <div class="prompt-line"><span>&gt;</span><input id="nameInput" maxlength="24" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Digite seu nome"><span class="block-cursor"></span></div>
      </form>
      <div id="actions" class="actions hidden"></div>
    </section>
  </main>
  <button id="soundToggle" class="sound-toggle" aria-label="Ativar ou desativar som">SND:OFF</button>
  <script src="script.js"></script>
</body>
</html>
